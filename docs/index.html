<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>eyeBrowser</title>
<link rel="icon" href="assets/logo-light.svg" type="image/svg+xml">
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: #101828; background: #fff; line-height: 1.5; }
  main { max-width: 960px; margin: 0 auto; padding: 48px 20px 64px; }
  h1 { margin: 0 0 8px; font-size: 1.6rem; }
  p { margin: 0 0 24px; max-width: 62ch; color: #4b5668; }
  .panel { display: flex; align-items: center; justify-content: center; padding: clamp(24px, 6vw, 64px); border-radius: 16px; margin-bottom: 20px; }
  .panel img { width: 100%; max-width: 760px; height: auto; display: block; }
  .light { background: #f4f7fa; }
  .dark { background: #0e1624; }
  .label { margin: 0 0 8px; font-size: .8rem; letter-spacing: .08em; text-transform: uppercase; color: #4b5668; }
  ul { margin: 0; padding: 0; list-style: none; display: flex; gap: 20px; flex-wrap: wrap; }
  a { color: #0b6f66; }
  footer { margin-top: 32px; font-size: .85rem; color: #4b5668; }
</style>
</head>
<body>
<main>
  <h1>eyeBrowser</h1>
  <p>A web browser for Android TV. The logo below is a tentative design: a squinting left eye, a raised right brow and a mirrored "y".</p>

  <p class="label">On light</p>
  <div class="panel light"><img src="assets/logo-light.svg" alt="eyeBrowser logo on a light background"></div>

  <p class="label">On dark</p>
  <div class="panel dark"><img src="assets/logo-dark.svg" alt="eyeBrowser logo on a dark background"></div>

  <ul>
    <li><a href="assets/logo-light.svg" download>Download SVG, light backgrounds</a></li>
    <li><a href="assets/logo-dark.svg" download>Download SVG, dark backgrounds</a></li>
  </ul>

  <footer>Letterforms are outlined from Fredoka (SIL Open Font License).</footer>
</main>
</body>
</html>
